# Builds and tests on every push and pull request, in elementary OS 8.
# A push to master also publishes the .debs as a GitHub Release, which
# arsfeld/pantheon-extras picks up into the apt repo.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/elementary/docker:stable
    steps:
      # Before checkout: without git in the container, actions/checkout
      # downloads a tarball and the build cannot read the commit.
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates zstd
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Only the finished libghostty-vt, never Zig's own cache.
      - uses: actions/cache@v6
        with:
          path: /opt/libghostty-vt
          key: libghostty-vt-${{ hashFiles('ci/build-libghostty-vt.sh') }}
      - name: Build, test and package
        run: ci/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "deb/$version" ./*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "Debian packages for elementary OS 8 (noble, amd64), built from $GITHUB_SHA. Install them from the apt repo: https://arsfeld.github.io/pantheon-extras"
